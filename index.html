<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PUSH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e5e5e3">
  <meta name="color-scheme" content="light">
  <meta name="description" content="One button. Follow the instruction. Don't miss.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PUSH">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/montserrat-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <main class="stage" id="stage">
    <div class="device" id="device">
      <div class="halo" aria-hidden="true"></div>

      <svg class="timer" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="timer__track" cx="50" cy="50" r="47"></circle>
        <circle class="timer__bar" id="timerBar" cx="50" cy="50" r="47" pathLength="100"></circle>
      </svg>

      <button class="push" id="push" type="button" aria-label="PUSH">
        <span class="push__glow push__glow--warm" aria-hidden="true"></span>
        <span class="push__glow push__glow--good" aria-hidden="true"></span>
        <span class="push__glow push__glow--bad" aria-hidden="true"></span>
        <span class="push__rim" aria-hidden="true"></span>
        <span class="push__face">
          <span class="face__top" id="faceTop"></span>
          <span class="face__main" id="faceMain">PUSH</span>
          <span class="face__sub" id="faceSub"></span>
          <span class="face__dots" id="faceDots" aria-hidden="true"></span>
        </span>
      </button>

      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
  </main>

  <!-- Corner menus: paper buttons that unfold into a panel -->
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <button class="corner corner--left" id="scoresBtn" type="button" aria-label="High scores" aria-expanded="false" aria-controls="scoresPanel">
    <span class="corner__disc">
      <svg class="corner__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.2 L20.6 11.4 H17.6 V19.8 H13.9 V15.4 H10.1 V19.8 H6.4 V11.4 H3.4 Z"/>
      </svg>
    </span>
  </button>
  <section class="panel panel--left" id="scoresPanel" aria-label="High scores" inert>
    <h2 class="panel__title">HIGH SCORES</h2>
    <div class="tabs" role="tablist" aria-label="Ranking">
      <button class="tab" type="button" role="tab" data-tab="world" aria-selected="true">WORLD</button>
      <button class="tab" type="button" role="tab" data-tab="mine" aria-selected="false">YOU</button>
    </div>
    <form class="namebox" id="nameForm" hidden>
      <label class="namebox__label" for="nameInput" id="nameLabel">ENTER YOUR NAME TO JOIN THE WORLD RANKING</label>
      <div class="namebox__row">
        <input class="field" id="nameInput" name="name" maxlength="16" placeholder="Your name" autocomplete="nickname" autocapitalize="words" enterkeyhint="done" spellcheck="false">
        <button class="namebox__save" type="submit">SAVE</button>
      </div>
    </form>
    <ol class="scores" id="scoresList"></ol>
    <p class="panel__empty" id="scoresEmpty"></p>
  </section>

  <button class="corner corner--right" id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">
    <span class="corner__disc">
      <svg class="corner__icon corner__icon--gear" viewBox="0 0 24 24" aria-hidden="true">
        <path fill-rule="evenodd" d="M19.32 9.97 L22.05 10.27 L22.05 13.73 L19.32 14.03 L18.61 15.75 L20.33 17.89 L17.89 20.33 L15.75 18.61 L14.03 19.32 L13.73 22.05 L10.27 22.05 L9.97 19.32 L8.25 18.61 L6.11 20.33 L3.67 17.89 L5.39 15.75 L4.68 14.03 L1.95 13.73 L1.95 10.27 L4.68 9.97 L5.39 8.25 L3.67 6.11 L6.11 3.67 L8.25 5.39 L9.97 4.68 L10.27 1.95 L13.73 1.95 L14.03 4.68 L15.75 5.39 L17.89 3.67 L20.33 6.11 L18.61 8.25Z M12 8.4 A3.6 3.6 0 1 0 12 15.6 A3.6 3.6 0 1 0 12 8.4Z"/>
      </svg>
    </span>
  </button>
  <section class="panel panel--right" id="settingsPanel" aria-label="Settings" inert>
    <h2 class="panel__title">SETTINGS</h2>
    <div class="opts">
      <div class="opt"><label class="opt__label" for="settingsName">NAME</label><input class="field field--inline" id="settingsName" name="settingsName" maxlength="16" placeholder="Your name" autocomplete="nickname" autocapitalize="words" enterkeyhint="done" spellcheck="false"></div>
      <div class="opt"><span class="opt__label" id="lblSound">SOUND</span><button class="switch" type="button" role="switch" aria-labelledby="lblSound" data-setting="sound"><i></i></button></div>
      <div class="opt"><span class="opt__label" id="lblHaptics">VIBRATION</span><button class="switch" type="button" role="switch" aria-labelledby="lblHaptics" data-setting="haptics"><i></i></button></div>
      <div class="opt"><span class="opt__label" id="lblDark">DARK MODE</span><button class="switch" type="button" role="switch" aria-labelledby="lblDark" data-setting="dark"><i></i></button></div>
    </div>
    <button class="panel__action" id="clearScores" type="button">CLEAR HIGH SCORES</button>
  </section>

  <!-- iOS 18+ haptic tick: toggling a native switch triggers the Taptic Engine -->
  <label class="haptic" id="hapticLabel" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
